[package]
name = "rust_Quant"
version = "0.1.0"
edition = "2024"

[dependencies]
# eframe 是官方提供的框架，幫你把 egui 封裝成桌面視窗 (底層用 wgpu 或 glow)
eframe = "0.27" 
# egui 官方維護的繪圖庫，拿來畫 K 線、RSI 曲線、FFT 頻譜圖非常方便
egui_plot = "0.27"
ureq = "2.9"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] } # ➕ 讓結構體支援序列化
bincode = "1.3" # ➕ 極速二進位編解碼器
rayon = "1.8"  # 平行運算